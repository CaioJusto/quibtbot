name: quibt-desktop

services:
  postgres:
    # Pin the multi-architecture index, not its amd64 child manifest. The old
    # child digest made an otherwise multi-arch release impossible to install on ARM VPSes.
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    environment:
      POSTGRES_USER: quibt
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?}
      POSTGRES_DB: quibt
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quibt"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  computer:
    image: ghcr.io/quibt/quibt-computer:${QUIBT_STACK_VERSION:?}
    command: ["true"]
    restart: "no"

  supervisor:
    image: ghcr.io/quibt/quibt-supervisor:${QUIBT_STACK_VERSION:?}
    env_file:
      - ${INSTALL_ENV_FILE:?}
    environment:
      # Um `quibt.env` gerado por uma instalação antiga ainda pode trazer NODE_ENV=development,
      # e o `env_file` ganharia da imagem: placeholders de segredo aceitos, token do supervisor
      # derivado do segredo de sessão e CORS frouxo. `environment` ganha do `env_file`.
      NODE_ENV: production
      DATA_DIR: ${DATA_DIR:?}
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      QUIBT_COMPUTER_IMAGE: ghcr.io/quibt/quibt-computer:${QUIBT_STACK_VERSION:?}
      SANDBOX_SCREEN_NETWORK: internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:?}:/data
      - ${INSTALL_ENV_FILE:?}:/run/quibt/quibt.env:ro
    depends_on:
      computer:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    image: ghcr.io/quibt/quibt-stack:${QUIBT_STACK_VERSION:?}
    command: ["pnpm", "--filter", "@quibt/api", "start"]
    env_file:
      - ${INSTALL_ENV_FILE:?}
    environment:
      # Ver o comentário do supervisor: um `quibt.env` antigo não pode rebaixar a API.
      NODE_ENV: production
      DATABASE_URL: postgres://quibt:${DATABASE_PASSWORD:?}@postgres:5432/quibt
      DATA_DIR: ${DATA_DIR:?}
      # Prints, PDFs e áudios da conversa: o worker grava, a API serve. Sem isto cada um
      # usava o ./data do próprio container — a imagem sumia do chat (404) e com o container.
      ARTIFACTS_DIR: /data/artifacts
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      AGENT_RUNTIME: pi
    ports:
      # O QR entrega o IP da LAN ao celular. Prender a API em 127.0.0.1 faz o QR
      # parecer correto, mas nenhum outro aparelho consegue abrir a porta.
      - "${QUIBT_API_BIND_HOST:-0.0.0.0}:3100:3100"
    volumes:
      - ${DATA_DIR:?}:/data
      - ${INSTALL_ENV_FILE:?}:/run/quibt/quibt.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ghcr.io/quibt/quibt-stack:${QUIBT_STACK_VERSION:?}
    command: ["pnpm", "--filter", "@quibt/worker", "start"]
    env_file:
      - ${INSTALL_ENV_FILE:?}
    environment:
      # Ver o comentário do supervisor: o worker roda o mesmo código da API.
      NODE_ENV: production
      DATABASE_URL: postgres://quibt:${DATABASE_PASSWORD:?}@postgres:5432/quibt
      DATA_DIR: ${DATA_DIR:?}
      # Prints, PDFs e áudios da conversa: o worker grava, a API serve. Sem isto cada um
      # usava o ./data do próprio container — a imagem sumia do chat (404) e com o container.
      ARTIFACTS_DIR: /data/artifacts
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      AGENT_RUNTIME: pi
    volumes:
      - ${DATA_DIR:?}:/data
      - ${INSTALL_ENV_FILE:?}:/run/quibt/quibt.env:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    image: ghcr.io/quibt/quibt-stack:${QUIBT_STACK_VERSION:?}
    command: ["pnpm", "--filter", "@quibt/web", "start"]
    env_file:
      - ${INSTALL_ENV_FILE:?}
    environment:
      NODE_ENV: production
      WEB_HOST: 0.0.0.0
      WEB_PORT: "5173"
      API_PROXY_TARGET: http://api:3100
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      WEB_ORIGIN: ${WEB_ORIGIN:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
    labels:
      quibt.screen-proxy: "true"
    ports:
      # O desktop fica só no próprio computador. A instalação VPS define
      # QUIBT_WEB_BIND_HOST=0.0.0.0 para aceitar acesso remoto explicitamente.
      - "${QUIBT_WEB_BIND_HOST:-127.0.0.1}:5173:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

  # HTTPS sem domínio de ninguém. Só sobe no profile `public`, que o instalador liga
  # quando o host tem IP público e as portas 80/443 estão livres: o nome vira
  # `quibt-xxxx.<ip>.sslip.io` (DNS público que resolve para o próprio IP), o Caddy tira
  # o Let's Encrypt sozinho por esse nome e renova sem cron. Web e API continuam presos
  # em 127.0.0.1 no host; só o Caddy encara a internet.
  caddy:
    # Índice multi-arch, como o postgres acima: um digest de filho amd64 não instala em VPS ARM.
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles: ["public"]
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${QUIBT_PUBLIC_HOST:-localhost}
      - --to
      - web:5173
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DATA_DIR:?}/caddy:/data
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
