services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quibt
      POSTGRES_PASSWORD: quibt
      POSTGRES_DB: quibt
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quibt"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  supervisor:
    build:
      context: ../sandboxes/supervisor
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      # O `.env` desta máquina é copiado do `.env.example`, que traz NODE_ENV=development para
      # o `pnpm dev`. No compose, `env_file` ganharia da imagem e religaria os placeholders de
      # segredo, a derivação do token do supervisor a partir do segredo de sessão e um CORS que
      # aceita qualquer localhost com credenciais. `environment` ganha do `env_file`: trava aqui.
      NODE_ENV: production
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      QUIBT_COMPUTER_IMAGE: quibt/computer:local
      SANDBOX_SCREEN_NETWORK: internal
    # Sem `ports`: a 7091 manda no Docker deste host, então ela fica na rede interna do
    # Compose. Quem quer o computador noutra máquina carrega, além do compose de instalação,
    # o arquivo `docker-compose.supervisor-tls.yml`, que põe um Caddy com TLS na frente —
    # nunca a porta crua. Ele mora à parte porque o Compose interpola o arquivo inteiro ao
    # carregar, mesmo com o profile desligado.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data:/data
    depends_on:
      computer:
        condition: service_completed_successfully
    restart: unless-stopped

  computer:
    image: quibt/computer:local
    build:
      context: ../sandboxes/computer
    command: ["true"]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["bash", "-lc", "pnpm --filter @quibt/db generate && pnpm --filter @quibt/db exec prisma migrate deploy && pnpm --filter @quibt/api start"]
    env_file:
      - ../../.env
    environment:
      # Ver o comentário do supervisor: um NODE_ENV antigo no `.env` não pode rebaixar a API.
      NODE_ENV: production
      DATABASE_URL: postgres://quibt:quibt@postgres:5432/quibt
      DATA_DIR: /data
      ARTIFACTS_DIR: /data/artifacts
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      AGENT_RUNTIME: pi
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../../data:/data
    # The api owns `prisma migrate deploy`, so "healthy" here means "schema is ready".
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["pnpm", "--filter", "@quibt/worker", "start"]
    env_file:
      - ../../.env
    environment:
      # Ver o comentário do supervisor: o worker roda o mesmo código da API.
      NODE_ENV: production
      DATABASE_URL: postgres://quibt:quibt@postgres:5432/quibt
      DATA_DIR: /data
      ARTIFACTS_DIR: /data/artifacts
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      AGENT_RUNTIME: pi
    volumes:
      - ../../data:/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Without this the worker races the migrations the api runs and dies on boot.
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["pnpm", "--filter", "@quibt/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      # O `vite preview` também decide pelo NODE_ENV se aceita um segredo de exemplo.
      NODE_ENV: production
      API_PROXY_TARGET: http://api:3100
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    labels:
      quibt.screen-proxy: "true"
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
