<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Quibt Bot</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #05080f;
        color: #f1f1f2;
        font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
      }
      p {
        color: #8e8e93;
        max-width: 460px;
        margin: 12px auto 0;
      }
      ol {
        max-width: 460px;
        margin: 20px auto 0;
        padding: 0 0 0 20px;
        color: #c7c7cc;
        text-align: left;
      }
      code {
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8a54b;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font: 600 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
        padding: 12px 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Quibt Bot precisa do stack local</h1>
      <p>
        Este app é local-first. Ele abre a interface na sua máquina. Suba a API
        e o app web, depois tente de novo.
      </p>
      <ol>
        <li>Instale o Docker Desktop.</li>
        <li>No repositório: <code>pnpm dev</code> (Postgres + API + web).</li>
        <li>O app procura <code>http://127.0.0.1:5173</code> por padrão.</li>
      </ol>
      <button type="button" id="retry">Tentar de novo</button>
    </main>
    <script>
      document.getElementById("retry")?.addEventListener("click", () => {
        const desktop = window.quibtDesktop;
        if (desktop?.reloadApp) desktop.reloadApp();
      });
    </script>
  </body>
</html>
